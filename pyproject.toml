[project]
name = "weather-pipeline-etl"
version = "1.0.0"
description = "ETL Pipeline for Weather Data from Spanish Cities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alvaro M", email = "alvaro@example.com"}
]
keywords = ["etl", "weather", "pipeline", "data-engineering", "airflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Repository = "https://github.com/AlvaroM99/WEATHER_PIPELINE_ETL"

# ============================================================================
# BLACK - Code Formatter
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.pytest_cache
    | tests/htmlcov
    | \.eggs
    | build
    | dist
    | migrations
)/
'''

# ============================================================================
# ISORT - Import Sorting
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".git", "__pycache__", ".venv", "venv", "tests/htmlcov"]
known_first_party = ["src"]
known_third_party = ["pandas", "requests", "minio", "psycopg2", "dotenv", "pyarrow", "great_expectations"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ============================================================================
# MYPY - Type Checking (Strict Configuration)
# ============================================================================
[tool.mypy]
python_version = "3.11"

# Strict type checking options
strict = false  # Start with false, enable gradually
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# Disallow untyped definitions (gradual adoption)
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false

# Check untyped calls
check_untyped_defs = true

# Strictness for None handling
strict_optional = true
no_implicit_optional = true

# Show error codes for easier ignoring
show_error_codes = true
show_column_numbers = true

# Performance
cache_dir = ".mypy_cache"

# Ignore missing imports for external libraries
ignore_missing_imports = true

# Exclude patterns
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "tests/htmlcov",
    "build",
    "dist",
]

# Per-module overrides for external libraries
[[tool.mypy.overrides]]
module = [
    "minio.*",
    "psycopg2.*",
    "great_expectations.*",
    "responses.*",
    "faker.*",
    "airflow.*",
    "pyarrow.*",
    "yaml.*",
    "requests.*"
]
ignore_missing_imports = true

# Less strict for DAGs (Airflow dynamic imports)
[[tool.mypy.overrides]]
module = "dags.*"
ignore_errors = true

# Less strict for tests (allow untyped defs in tests)
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# ============================================================================
# PYTEST - Testing Configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=html:tests/htmlcov",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=60"
]
markers = [
    "unit: Unit tests (isolated components)",
    "integration: Integration tests (multi-component)",
    "database: Tests requiring database connection",
    "slow: Tests that take >1 second",
    "api: Tests that mock external APIs",
    "data_quality: Data quality validation tests"
]
norecursedirs = [".git", "__pycache__", "tests/htmlcov", ".pytest_cache"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

# ============================================================================
# COVERAGE - Code Coverage
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
data_file = "tests/.coverage"
omit = [
    "tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "dags/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:"
]
fail_under = 60
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "tests/htmlcov"

# ============================================================================
# RUFF - Fast Python Linter (Alternative to flake8)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "tests/htmlcov",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # line too long (handled by black)
    "E203",   # whitespace before ':' (conflicts with black)
    "E266",   # too many leading '#' for block comment
    "E402",   # module level import not at top of file
    "W503",   # line break before binary operator
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "B011", "F401", "F811", "F841", "E722"]
"conftest.py" = ["F401", "F811"]
"src/extractor.py" = ["F401", "F841"]
"src/loader.py" = ["F401"]
"src/transformer.py" = ["F841", "E722"]
"src/data_quality/validators.py" = ["F401"]
"src/data_quality/expectations.py" = ["F401"]
"src/utils/debug_utils.py" = ["F401"]
"src/utils/minio_client.py" = ["F401"]

# ============================================================================
# BANDIT - Security Linter
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B311"]  # Skip assert and random warnings

# ============================================================================
# BUILD SYSTEM
# ============================================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
