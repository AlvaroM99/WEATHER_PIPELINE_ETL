# Pre-commit hooks for Weather Pipeline ETL
# Install: pip install -r requirements/dev.txt && pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/htmlcov/|\.pytest_cache/)
      - id: end-of-file-fixer
        exclude: ^(tests/htmlcov/|\.pytest_cache/)
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in YAML
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: ['--config', 'pyproject.toml']
        language_version: python3.11

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--settings-path', 'pyproject.toml']

  # Linting with ruff (faster alternative to flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: ['--config', 'pyproject.toml']

  # Type checking (optional, runs on changed files only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--config-file', 'pyproject.toml']
        additional_dependencies:
          - pandas-stubs
          - types-requests
        pass_filenames: false
        entry: mypy src/
        stages: [manual]  # Only run with: pre-commit run mypy --hook-stage manual

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ['-r', 'src/', '-ll', '--skip', 'B101,B311']
        stages: [manual]  # Only run with: pre-commit run bandit --hook-stage manual

  # Docstring formatting (optional)
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ['--convention=google', '--add-ignore=D100,D104,D105,D107']
        stages: [manual]

  # Check for debug statements
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: debug-statements

  # Check .env files are not committed
  - repo: local
    hooks:
      - id: check-env-files
        name: Check .env files are not committed
        entry: bash -c 'if git diff --cached --name-only | grep -E "^\.env$|^\.env\..+$" | grep -v "\.example$"; then echo "ERROR: .env files should not be committed"; exit 1; fi'
        language: system
        pass_filenames: false

  # Run tests before push (optional)
  - repo: local
    hooks:
      - id: pytest-check
        name: Run pytest (unit tests only)
        entry: pytest tests/unit/ -v -x --no-cov -m "not slow and not database"
        language: system
        pass_filenames: false
        stages: [push]  # Only run on git push

# CI Skip configuration
# Add [skip ci] or [ci skip] to commit message to skip CI
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [pytest-check, mypy, bandit, pydocstyle]
  submodules: false
