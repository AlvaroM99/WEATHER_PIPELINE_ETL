name: CD - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3 or latest)'
        required: true
        default: 'latest'
      skip_tests:
        description: 'Skip smoke tests (emergency deployments only)'
        required: false
        default: false
        type: boolean

env:
  ENVIRONMENT: production
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Pre-deployment checks
  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version exists
        run: |
          echo "🔍 Verifying Docker image exists..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        run: |
          echo "🔒 Checking for critical vulnerabilities..."
          docker run --rm \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}

  # Production deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment:
      name: production
      url: https://weather-etl.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          echo "image_tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "deploy_time=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create deployment backup
        run: |
          echo "💾 Creating deployment backup marker..."
          echo "Backup for deployment: ${{ steps.vars.outputs.deploy_time }}" > deployment_backup.txt
          echo "Version: ${{ steps.vars.outputs.image_tag }}" >> deployment_backup.txt
          echo "Deployed by: ${{ github.actor }}" >> deployment_backup.txt

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production (Blue-Green)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
            set -e

            echo "🚀 Starting PRODUCTION deployment (Blue-Green)..."

            # Navigate to project directory
            cd /opt/weather-etl

            # Pull latest code
            git fetch origin
            git checkout master
            git pull origin master

            # Pull new Docker image
            echo "📦 Pulling Docker image: ${{ steps.vars.outputs.image_tag }}..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}

            # Tag for production
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }} weather-pipeline-etl:production

            # Backup current state
            echo "💾 Backing up current state..."
            bash scripts/deploy.sh production ${{ steps.vars.outputs.image_tag }}

            echo "✅ Production deployment completed!"
          EOF

      - name: Wait for stabilization
        run: |
          echo "⏳ Waiting for services to stabilize (60 seconds)..."
          sleep 60

      - name: Health Check
        run: |
          echo "🏥 Running production health checks..."

          HEALTH_URL="https://${{ secrets.PROD_SERVER_HOST }}/health"
          MAX_RETRIES=20
          RETRY=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            if curl -f -s "$HEALTH_URL" > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              break
            fi
            RETRY=$((RETRY + 1))
            if [ $RETRY -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after $MAX_RETRIES attempts"
              echo "🔄 Initiating automatic rollback..."
              ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
                "cd /opt/weather-etl && bash scripts/deploy.sh --rollback"
              exit 1
            fi
            echo "⏳ Health check attempt $RETRY/$MAX_RETRIES, retrying..."
            sleep 15
          done

      - name: Run Smoke Tests
        if: ${{ !github.event.inputs.skip_tests }}
        run: |
          echo "🧪 Running production smoke tests..."

          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
            cd /opt/weather-etl

            if bash scripts/smoke_tests.sh; then
              echo "✅ Smoke tests passed!"
            else
              echo "❌ Smoke tests failed!"
              echo "🔄 Initiating automatic rollback..."
              bash scripts/deploy.sh --rollback
              exit 1
            fi
          EOF

      - name: Monitor for 5 minutes
        run: |
          echo "👀 Monitoring production for 5 minutes..."

          for i in {1..5}; do
            echo "Monitoring cycle $i/5..."

            # Check health
            if ! curl -f -s "https://${{ secrets.PROD_SERVER_HOST }}/health" > /dev/null 2>&1; then
              echo "❌ Health check failed during monitoring!"
              echo "🔄 Initiating automatic rollback..."
              ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
                "cd /opt/weather-etl && bash scripts/deploy.sh --rollback"
              exit 1
            fi

            echo "✅ Health check $i/5 passed"
            sleep 60
          done

          echo "✅ Monitoring complete - deployment is stable!"

      - name: Cleanup old images
        if: success()
        run: |
          echo "🧹 Cleaning up old Docker images..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "docker image prune -f"

      - name: Deployment Summary
        if: always()
        run: |
          echo "### Production Deployment Summary 🎯" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** ${{ steps.vars.outputs.deploy_time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Skip tests:** ${{ github.event.inputs.skip_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Health checks: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.skip_tests }}" = "false" ]; then
            echo "- Smoke tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Smoke tests: ⏭️ Skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Monitoring: ✅ Stable (5 minutes)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🎯 Production Deployment ${{ job.status }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nproduction"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n`${{ steps.vars.outputs.image_tag }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deployed by:*\n@${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ job.status }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Deployed at: ${{ steps.vars.outputs.deploy_time }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Release (if version tag)
        if: startsWith(github.event.inputs.version, 'v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            ## Production Deployment
            Deployed to production on ${{ steps.vars.outputs.deploy_time }}

            ### Changes
            - Version: ${{ github.event.inputs.version }}
            - Deployed by: @${{ github.actor }}

            ### Deployment Info
            - Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}`
            - Health checks: ✅ Passed
            - Smoke tests: ${{ github.event.inputs.skip_tests && '⏭️ Skipped' || '✅ Passed' }}
          draft: false
          prerelease: false
