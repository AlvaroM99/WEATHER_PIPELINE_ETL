name: CI Pipeline

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff mypy bandit pandas-stubs types-requests

      - name: Check code formatting with Black
        run: |
          black --check --diff src/ tests/ dags/

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff src/ tests/ dags/

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ dags/

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary

      - name: Security scan with Bandit
        run: |
          bandit -r src/ -ll --skip B101,B311

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_pass
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing -m "not database and not slow"
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_pass
          POSTGRES_DB: weather_db

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=src --cov-append --cov-report=xml -m "not database"
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: weather_user
          POSTGRES_PASSWORD: weather_pass
          POSTGRES_DB: weather_db

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-weather-pipeline
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=60

  data-quality:
    name: Data Quality Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt

      - name: Validate data quality framework
        run: |
          python -c "
          from src.data_quality.validators import DataQualityValidator
          from src.data_quality.expectations import (
              WEATHER_OBSERVATION_CONFIG,
              DAILY_FORECAST_CONFIG,
              HOURLY_FORECAST_CONFIG,
              AIR_QUALITY_CONFIG,
              POLLEN_CONFIG,
              MARINE_CONFIG
          )
          from src.data_quality.metrics import DataQualityMetrics
          from src.data_quality.exceptions import DataQualityException

          # Verify all components are importable
          print('Data Quality Framework validated successfully!')
          print(f'Available configs: WEATHER_OBSERVATION, DAILY_FORECAST, HOURLY_FORECAST, AIR_QUALITY, POLLEN, MARINE')
          "

      - name: Run data quality tests
        run: |
          pytest tests/ -v -k "data_quality or quality or validation" --no-cov

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt

      - name: Verify imports
        run: |
          python -c "
          # Verify all main modules are importable
          from src.extractor import Extractor
          from src.transformer import Transformer
          from src.loader import Loader
          from src.dimensional_loader import DimensionalLoader
          print('All main modules imported successfully!')
          "

      - name: Check for syntax errors
        run: |
          python -m py_compile src/*.py
          python -m py_compile src/config/*.py
          python -m py_compile src/utils/*.py
          python -m py_compile src/data_quality/*.py
          echo "No syntax errors found!"
