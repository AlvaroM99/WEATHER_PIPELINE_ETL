# ============================================================================
# Docker Compose - Production Environment
# ============================================================================
# Production-optimized configuration with:
# - Higher resource limits
# - JSON structured logging
# - Larger connection pools
# - Production-grade security settings
# - No debug tools (pgAdmin, Metabase optional)
# ============================================================================

services:
  # Airflow - Production Mode
  airflow:
    image: weather-pipeline-etl:production
    environment:
      # Production environment
      ENVIRONMENT: production
      ENABLE_JSON_LOGGING: "true"  # JSON logs for production monitoring
      DB_POOL_MIN_CONN: 5
      DB_POOL_MAX_CONN: 50  # Higher for production load
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"  # Safety: pause new DAGs
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"  # Hide config in production
      AIRFLOW__WEBSERVER__RBAC: "True"  # Strict RBAC
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
      AIRFLOW__METRICS__STATSD_ON: "True"  # Enable metrics
      AIRFLOW__METRICS__STATSD_HOST: statsd
      AIRFLOW__METRICS__STATSD_PORT: 8125
      # Production API rate limits
      RATE_LIMIT_OPENWEATHER_MAX_CALLS: 60
      RATE_LIMIT_OPENWEATHER_PERIOD_SECONDS: 60
      RATE_LIMIT_OPENMETEO_MAX_CALLS: 10
      RATE_LIMIT_OPENMETEO_PERIOD_SECONDS: 1
      RATE_LIMIT_AEMET_MAX_CALLS: 60
      RATE_LIMIT_AEMET_PERIOD_SECONDS: 60
    volumes:
      # Read-only mounts for security (no hot reload in production)
      - ./dags:/opt/airflow/dags:ro
      - ./plugins:/opt/airflow/plugins:ro
      - airflow_logs_prod:/opt/airflow/logs
      # No src mount - baked into image
    ports:
      - "8080:8080"
    command: /opt/airflow/scripts/entrypoint.sh
    deploy:
      resources:
        limits:
          memory: 8G  # Higher for production
          cpus: "4.0"
        reservations:
          memory: 4G
          cpus: "2.0"
    restart: always  # Always restart in production
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "/opt/airflow/scripts/health_check.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # PostgreSQL DWH - Production
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db_prod}
      # Production PostgreSQL tuning
      POSTGRES_MAX_CONNECTIONS: 100
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_WORK_MEM: 50MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups  # For backups
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    # Production backup job (runs daily)
    # Uncomment if using docker-compose for scheduling
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=false"

  # PostgreSQL Airflow Metadata - Production
  postgres-airflow:
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_prod}
      POSTGRES_MAX_CONNECTIONS: 50
    volumes:
      - postgres_airflow_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # MinIO - Production
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Production MinIO settings
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_prod:/data
      - ./backups:/backups
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Metabase - Production (optional, for dashboards)
  metabase:
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db_prod
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_JETTY_PORT: 3000
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ⚠️ pgAdmin DISABLED in production for security
  # Uncomment only if absolutely necessary and use strong credentials
  # pgadmin:
  #   profiles:
  #     - debug  # Only start with --profile debug

# Production volumes with backup labels
volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/weather-etl/data/postgres
  postgres_airflow_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/weather-etl/data/postgres-airflow
  airflow_logs_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/weather-etl/logs/airflow
  minio_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/weather-etl/data/minio

# Production network with custom settings
networks:
  airflow_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
