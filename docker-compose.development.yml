# ============================================================================
# Docker Compose - Development Environment
# ============================================================================
# Extends docker-compose.yml with development-specific overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.development.yml up
# Or: docker-compose -f docker-compose.development.yml up (if used standalone)
# ============================================================================

services:
  # Airflow - Development Mode
  airflow:
    image: weather-pipeline-etl:development
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Development-specific environment
      ENVIRONMENT: development
      ENABLE_JSON_LOGGING: "false"  # Human-readable logs for dev
      DB_POOL_MIN_CONN: 2
      DB_POOL_MAX_CONN: 10  # Lower for development
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"  # Allow config viewing in dev
      AIRFLOW__WEBSERVER__RBAC: "False"  # Simplified auth for dev
      AIRFLOW__API__AUTH_BACKEND: airflow.api.auth.backend.basic_auth
    volumes:
      # Mount source code for hot reload
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./plugins:/opt/airflow/plugins
      - ./requirements:/opt/airflow/requirements
      - ./scripts:/opt/airflow/scripts
      - airflow_logs_dev:/opt/airflow/logs
    ports:
      - "8080:8080"  # Airflow webserver
    command: /opt/airflow/scripts/entrypoint.sh
    deploy:
      resources:
        limits:
          memory: 2G  # Lower limits for dev
          cpus: "1.0"
    restart: unless-stopped

  # PostgreSQL DWH - Development
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather_pass}
      POSTGRES_DB: ${POSTGRES_DB:-weather_db_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 1G  # Lower for dev
          cpus: "0.5"

  # PostgreSQL Airflow Metadata - Development
  postgres-airflow:
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_dev}
    volumes:
      - postgres_airflow_data_dev:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # MinIO - Development
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data_dev:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # pgAdmin - Development (included for debugging)
  pgadmin:
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dev.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # Metabase - Development (optional, comment out if not needed)
  metabase:
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db_dev
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-weather_user}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-weather_pass}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

# Development-specific volumes
volumes:
  postgres_data_dev:
  postgres_airflow_data_dev:
  airflow_logs_dev:
  minio_data_dev:

# Shared network
networks:
  airflow_net:
    driver: bridge
